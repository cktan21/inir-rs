[package]
name = "inir-utils"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
inir-types = { path = "../inir-types" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
regex = "1.12"
web_atoms = "0.2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "multipart", "stream"] }
fs2 = "0.4"
tempfile = "3.27"
libc = "0.2"
udev = { version = "0.9.3", features = ["sync"] }
futures-util = "0.3"
xkbcommon = { version = "0.9", default-features = false }
unicode-general-category = "1"
unicode-normalization = "0.1"
evdev = { version = "0.13.2", features = ["tokio"] }
notify = "8.2"

[dev-dependencies]
tempfile = "3.27"
