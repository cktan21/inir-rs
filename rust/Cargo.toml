[workspace]
members = ["inir-core", "inir-qt", "inir-types", "inir-utils", "inir-helper"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "net", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
